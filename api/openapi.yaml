openapi: 3.0.0
info:
  contact:
    email: development@kvalitetitsit.dk
  description: API description for DNS API.
  title: DNS API
  version: 1.0.0
servers:
- url: "{protocol}://{environment}:{port}"
  variables:
    protocol:
      default: http
      enum:
      - http
      - https
    environment:
      default: localhost
      enum:
      - localhost
    port:
      default: "8080"
      enum:
      - "8080"
tags:
- description: API for DNS records
  name: Records
paths:
  /records:
    delete:
      description: Deletes the dns records.
      parameters:
      - explode: false
        in: header
        name: record_ids
        required: true
        schema:
          items:
            format: uuid
            type: string
          type: array
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordCollection"
          description: Ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/basic_error"
          description: "Bad Request. This could be because: * One of the required\
            \ parameters/properties are missing or is empty <br> * Length of input\
            \ is exceeding maximum length <br> (See a possible detailed error message\
            \ in the in the response.)"
      summary: Deletes the dns records.
      tags:
      - Records
    get:
      description: Retrieves all records matching the input query parameters.
      parameters:
      - description: Fully qualifies domain name
        explode: true
        in: query
        name: fqdn
        required: false
        schema:
          type: string
        style: form
      - description: Number of items to skip
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          example: 0
          minimum: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          example: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: type
        required: false
        schema:
          $ref: "#/components/schemas/DnsRecordType"
        style: form
      - description: The source of the record
        explode: true
        in: query
        name: source
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordCollection"
          description: Ok
      summary: Retrieves all records.
      tags:
      - Records
    post:
      description: Add records.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCollection"
        description: The new records.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordCollection"
          description: Ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/basic_error"
          description: "Bad Request. This could be because: * One of the required\
            \ parameters/properties are missing or is empty <br> * Length of input\
            \ is exceeding maximum length <br> (See a possible detailed error message\
            \ in the in the response.)"
      summary: Add records.
      tags:
      - Records
  /records/{record_id}:
    delete:
      description: Deletes the dns record.
      parameters:
      - description: Fully qualifies domain name
        explode: false
        in: path
        name: record_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
          description: Ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/basic_error"
          description: "Bad Request. This could be because: * One of the required\
            \ parameters/properties are missing or is empty <br> * Length of input\
            \ is exceeding maximum length <br> (See a possible detailed error message\
            \ in the in the response.)"
      summary: Deletes the dns record.
      tags:
      - Records
    get:
      description: Get DNS record.
      parameters:
      - description: the UUID of the record
        explode: false
        in: path
        name: record_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
          description: Ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/basic_error"
          description: "Bad Request. This could be because: * One of the required\
            \ parameters/properties are missing or is empty <br> * Length of input\
            \ is exceeding maximum length <br> (See a possible detailed error message\
            \ in the in the response.)"
      summary: Get DNS record.
      tags:
      - Records
components:
  responses:
    "204":
      description: No Content
    "400":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/basic_error"
      description: "Bad Request. This could be because: * One of the required parameters/properties\
        \ are missing or is empty <br> * Length of input is exceeding maximum length\
        \ <br> (See a possible detailed error message in the in the response.)"
  schemas:
    RecordCollection:
      example:
        records:
        - id: 66101ef0-3e34-470d-92ea-53b89ad036e7
          fqdn: dsdn.dk
          type: type
          source: source
          ipv4: 192.168.1.10
        - id: 66101ef0-3e34-470d-92ea-53b89ad036e7
          fqdn: dsdn.dk
          type: type
          source: source
          ipv4: 192.168.1.10
      properties:
        records:
          items:
            $ref: "#/components/schemas/Record"
          type: array
      required:
      - records
      type: object
    Record:
      discriminator:
        mapping:
          A: "#/components/schemas/ARecord"
          AAAA: "#/components/schemas/AAAARecord"
          CNAME: "#/components/schemas/CNAMERecord"
          MX: "#/components/schemas/MXRecord"
          TXT: "#/components/schemas/TXTRecord"
          NS: "#/components/schemas/NSRecord"
          SOA: "#/components/schemas/SOARecord"
          SRV: "#/components/schemas/SRVRecord"
          PTR: "#/components/schemas/PTRRecord"
          CAA: "#/components/schemas/CAARecord"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/ARecord"
      - $ref: "#/components/schemas/AAAARecord"
      - $ref: "#/components/schemas/CNAMERecord"
      - $ref: "#/components/schemas/MXRecord"
      - $ref: "#/components/schemas/TXTRecord"
      - $ref: "#/components/schemas/NSRecord"
      - $ref: "#/components/schemas/SOARecord"
      - $ref: "#/components/schemas/SRVRecord"
      - $ref: "#/components/schemas/PTRRecord"
      - $ref: "#/components/schemas/CAARecord"
    RecordBase:
      description: Base DNS record properties.
      properties:
        id:
          description: UUID v4 associated with the DNS record.
          example: 66101ef0-3e34-470d-92ea-53b89ad036e7
          format: uuid
          type: string
        fqdn:
          description: Fully qualified domain name
          example: dsdn.dk
          type: string
        type:
          description: DNS record type discriminator.
          type: string
        source:
          description: "Identifies the system, service, or user that created the DNS\
            \ record. This field is used for auditing, traceability, and ownership\
            \ purposes. Typical values include the name of an automation system, application,\
            \ integration, or a user identifier"
          type: string
      required:
      - fqdn
      - source
      - type
      type: object
    ARecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          ipv4:
            description: IPv4 address assigned to the hostname.
            example: 192.168.1.10
            format: ipv4
            type: string
        required:
        - ipv4
        type: object
      description: DNS A record mapping a hostname to an IPv4 address.
      example:
        id: 66101ef0-3e34-470d-92ea-53b89ad036e7
        fqdn: dsdn.dk
        type: type
        source: source
        ipv4: 192.168.1.10
    AAAARecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          ipv6:
            description: IPv6 address assigned to the hostname.
            example: 2001:db8::10
            format: ipv6
            type: string
        required:
        - ipv6
        type: object
      description: DNS AAAA record mapping a hostname to an IPv6 address.
    CNAMERecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          target:
            description: Canonical hostname target.
            example: server.example.com
            type: string
        required:
        - target
        type: object
      description: DNS CNAME record mapping an alias hostname to a canonical hostname.
    MXRecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          priority:
            description: Mail server priority where lower values are preferred.
            example: 10
            minimum: 0
            type: integer
          exchange:
            description: Mail server hostname.
            example: mail.example.com
            type: string
        required:
        - exchange
        - priority
        type: object
      description: DNS MX record defining the mail servers responsible for handling
        email delivery for a domain.
    TXTRecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          value:
            description: TXT record value.
            example: v=spf1 include:_spf.example.com ~all
            type: string
        required:
        - value
        type: object
      description: "DNS TXT record used for arbitrary text-based metadata such as\
        \ SPF, DKIM, and domain verification."
    NSRecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          nameserver:
            description: Authoritative nameserver hostname.
            example: ns1.example.com
            type: string
        required:
        - nameserver
        type: object
      description: DNS NS record delegating authority for a DNS zone to an authoritative
        nameserver.
    SOARecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          mName:
            description: Primary master nameserver for the zone.
            example: ns1.example.com
            type: string
          rName:
            description: Responsible party email (encoded format).
            example: hostmaster.example.com
            type: string
          serial:
            example: 2026050101
            format: int64
            type: integer
          refresh:
            example: 7200
            type: integer
          retry:
            example: 3600
            type: integer
          expire:
            example: 1209600
            type: integer
          minimum:
            example: 3600
            type: integer
        required:
        - expire
        - mName
        - minimum
        - rName
        - refresh
        - retry
        - serial
        type: object
      description: DNS SOA record containing administrative and timing information
        for a DNS zone.
    SRVRecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          priority:
            description: Service priority where lower values are preferred.
            example: 10
            minimum: 0
            type: integer
          weight:
            description: Relative weight for load balancing between services with
              the same priority.
            example: 5
            minimum: 0
            type: integer
          port:
            description: Network port exposed by the target service.
            example: 443
            maximum: 65535
            minimum: 1
            type: integer
          target:
            description: Target hostname providing the service.
            example: sip.example.com
            type: string
        required:
        - port
        - priority
        - target
        - weight
        type: object
      description: DNS SRV record defining the hostname and port for a specific service.
    PTRRecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          pointer:
            description: Reverse DNS hostname target.
            example: server.example.com
            type: string
        required:
        - pointer
        type: object
      description: DNS PTR record used for reverse DNS lookups from IP addresses to
        hostnames.
    CAARecord:
      allOf:
      - $ref: "#/components/schemas/RecordBase"
      - properties:
          flags:
            description: Flags controlling record interpretation.
            example: 0
            maximum: 255
            minimum: 0
            type: integer
          tag:
            description: CAA property tag defining the authorization behavior.
            enum:
            - issue
            - issuewild
            - iodef
            example: issue
            type: string
          value:
            description: Certificate authority authorization value.
            example: letsencrypt.org
            type: string
        required:
        - flags
        - tag
        - value
        type: object
      description: DNS CAA record restricting which certificate authorities may issue
        TLS certificates for a domain.
    basic_error:
      description: Standard API error response returned when a request fails.
      example:
        error_code: 0
        error: error
        path: path
        status: 6
        status_text: status_text
        timestamp: 2000-01-23T04:56:07.000+00:00
      properties:
        error_code:
          description: Application-specific error code.
          type: integer
        error:
          description: Human-readable error message.
          type: string
        path:
          description: Request path that caused the error.
          type: string
        status:
          description: HTTP status code.
          type: integer
        status_text:
          description: HTTP status text.
          type: string
        timestamp:
          description: Timestamp when the error occurred.
          format: date-time
          type: string
      required:
      - error
      - error_code
      - path
      - status
      - status_text
      - timestamp
      type: object
    DnsRecordType:
      description: |
        Supported DNS record types: * `A` - IPv4 address record mapping a domain to a 32-bit IPv4 address. * `AAAA` - IPv6 address record mapping a domain to a 128-bit IPv6 address. * `CNAME` - Canonical name record mapping an alias to the canonical hostname. * `MX` - Mail exchanger record defining the mail servers responsible for a domain. * `TXT` - Text record used for metadata, SPF policies, and domain verification. * `NS` - Nameserver record delegating a DNS zone to authoritative nameservers. * `SOA` - Start of authority record containing zone administration and timing information. * `SRV` - Service locator record defining hostname and port information for a service. * `PTR` - Pointer record used for reverse DNS lookups from IP address to hostname. * `CAA` - Certificate authority authorization record restricting certificate issuance.
      enum:
      - A
      - AAAA
      - CNAME
      - MX
      - TXT
      - NS
      - SOA
      - SRV
      - PTR
      - CAA
      example: A
      type: string
